name: Publish Release

# Local caller workflow for the qilletni-docgen component.
#
# Preparing a release is done via the "Release - Prepare" workflow
# (release-prepare.yml), which opens a `release/qilletni-docgen-X.Y.Z` PR
# carrying a `release/pending-release.json` marker. Merging that PR to
# `master` does NOT require a maintainer to push a tag: the `tag-release`
# job below detects the marker, validates its provenance, and idempotently
# creates the immutable `vX.Y.Z` tag at the merge commit itself, which then
# triggers `build-and-publish`. A direct `vX.Y.Z` tag push remains supported
# only as a manual recovery path if that automation ever fails.
#
# Snapshot publishing (push to `master` while the version is still
# `-SNAPSHOT`) is kept in its own job so a stable release merge is never
# mistaken for a snapshot push. See Qilletni/Qilletni's RELEASE.md for the
# full cross-repository protocol.

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master

permissions:
  contents: read

jobs:
  # Runs only on a push to `master`. Distinguishes an ordinary/snapshot
  # commit from a just-merged release-preparation PR, and - only for the
  # latter - idempotently creates the immutable release tag.
  tag-release:
    runs-on: ubuntu-latest
    if: github.repository == 'Qilletni/QilletniDocgen' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: Qilletni/Qilletni
          path: .qilletni-release-tooling
          sparse-checkout: tools/release
          submodules: true  # tools/release submodule (Qilletni/ReleaseTooling)

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .qilletni-release-tooling/tools/release/package-lock.json

      - name: Install release tooling dependencies
        working-directory: .qilletni-release-tooling/tools/release
        run: npm ci

      - name: Detect whether this commit is a release-preparation merge
        id: detect
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          ROOT_VERSION=$(node --import tsx src/cli.ts get-property --file ../../../gradle.properties --key qilletniDocgenVersion)
          echo "Version on master: $ROOT_VERSION"

          if [[ "$ROOT_VERSION" =~ -SNAPSHOT$ ]]; then
            if [[ -f ../../../release/pending-release.json ]]; then
              echo "::error::Unexpected release/pending-release.json marker present alongside a SNAPSHOT version ($ROOT_VERSION); refusing to auto-tag."
              exit 1
            fi
            echo "Ordinary snapshot commit; nothing to tag here."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f ../../../release/pending-release.json ]]; then
            echo "::error::Version '$ROOT_VERSION' is not a SNAPSHOT and no release/pending-release.json marker was found. A stable version may only reach master through the release-preparation PR."
            exit 1
          fi

          echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$ROOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate the release marker
        if: steps.detect.outputs.is_release_merge == 'true'
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          node --import tsx src/cli.ts check-release-marker \
            --marker ../../../release/pending-release.json \
            --expected-component qilletni-docgen \
            --expected-version "${{ steps.detect.outputs.version }}"

      - name: Validate this commit came from a genuine, merged release PR
        if: steps.detect.outputs.is_release_merge == 'true'
        working-directory: .qilletni-release-tooling/tools/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | node --import tsx src/cli.ts check-merge-provenance \
                --component qilletni-docgen \
                --version "${{ steps.detect.outputs.version }}"

      - name: Idempotently create the immutable release tag
        if: steps.detect.outputs.is_release_merge == 'true'
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          EXISTING_SHA=$(git rev-parse "refs/tags/$TAG" 2>/dev/null || true)

          if [[ -n "$EXISTING_SHA" ]]; then
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag '$TAG' already exists at a different commit ($EXISTING_SHA); refusing to move an immutable release tag."
              exit 1
            fi
            echo "Tag '$TAG' already exists at this commit; nothing to do (idempotent)."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  # Runs only on a push to `master` while the version is still a SNAPSHOT.
  publish-snapshot:
    runs-on: ubuntu-latest
    needs: tag-release
    if: github.repository == 'Qilletni/QilletniDocgen' && needs.tag-release.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5

      - name: Check this is a SNAPSHOT version
        id: check
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')

          if [[ ! "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "Not a SNAPSHOT version ($VERSION); this push was a release merge, handled by build-and-publish instead."
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot
        if: steps.check.outputs.is_snapshot == 'true'
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  # Runs only on a `vX.Y.Z` tag push - either created automatically by
  # `tag-release` above, or (recovery path) pushed directly by a maintainer.
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.repository == 'Qilletni/QilletniDocgen' && startsWith(github.ref, 'refs/tags/')
    environment: production-release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ github.sha }}
      sha256: ${{ steps.hashes.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/checkout@v7
        with:
          repository: Qilletni/Qilletni
          path: .qilletni-release-tooling
          sparse-checkout: |
            release/components.yml
            tools/release
          submodules: true  # tools/release submodule (Qilletni/ReleaseTooling)

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .qilletni-release-tooling/tools/release/package-lock.json

      - name: Install release tooling dependencies
        working-directory: .qilletni-release-tooling/tools/release
        run: npm ci

      - name: Validate release configuration and registry
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          node --import tsx src/cli.ts validate-release-config --config "$GITHUB_WORKSPACE/.qilletni/release.yml"
          node --import tsx src/cli.ts validate-components-registry --registry "$GITHUB_WORKSPACE/.qilletni-release-tooling/release/components.yml" \
            --allowed-repository Qilletni/Qilletni \
            --allowed-repository Qilletni/QilletniToolchain \
            --allowed-repository Qilletni/QPMCLI \
            --allowed-repository Qilletni/QilletniPackageUtility \
            --allowed-repository Qilletni/QilletniDocgen

      - name: Check the tag matches qilletniDocgenVersion
        id: check
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')

          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Error: Tag version $TAG_VERSION does not match build version $VERSION"
            exit 1
          fi

          if [[ "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "Error: Cannot release a SNAPSHOT version on a tag."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Confirmed Release: $TAG_VERSION"

      - name: Ensure the resolved dependency graph has no SNAPSHOT/dynamic versions
        run: ./gradlew checkNoSnapshotDependencies

      - name: Determine previous released version
        id: previous
        run: |
          curl -sf "https://repo1.maven.org/maven2/dev/qilletni/docgen/qilletni-docgen/maven-metadata.xml" -o maven-metadata.xml
          PREVIOUS=$(grep -oP '(?<=<release>)[^<]+' maven-metadata.xml || true)
          if [[ -z "$PREVIOUS" ]]; then
            echo "No previously released version found (first release); skipping japicmp gate."
            echo "previous_version=" >> "$GITHUB_OUTPUT"
          else
            echo "previous_version=$PREVIOUS" >> "$GITHUB_OUTPUT"
          fi

      - name: Download baseline jar (when a previous version exists)
        id: baseline
        if: steps.previous.outputs.previous_version != ''
        run: |
          PREV="${{ steps.previous.outputs.previous_version }}"
          BASE_URL="https://repo1.maven.org/maven2/dev/qilletni/docgen/qilletni-docgen/${PREV}/qilletni-docgen-${PREV}.jar"
          curl -sf --retry 5 --retry-delay 10 "$BASE_URL" -o "/tmp/qilletni-docgen-baseline.jar"
          curl -sf --retry 5 --retry-delay 10 "$BASE_URL.sha1" -o "/tmp/qilletni-docgen-baseline.jar.sha1"
          echo "$(cat /tmp/qilletni-docgen-baseline.jar.sha1)  /tmp/qilletni-docgen-baseline.jar" | sha1sum -c -
          echo "jar=/tmp/qilletni-docgen-baseline.jar" >> "$GITHUB_OUTPUT"

      - name: Determine japicmp policy tier (prefer the release marker over Maven Central diffing)
        id: policy
        if: steps.previous.outputs.previous_version != ''
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          if [[ -f "$GITHUB_WORKSPACE/release/pending-release.json" ]]; then
            POLICY=$(node --import tsx src/cli.ts read-marker-bump --marker "$GITHUB_WORKSPACE/release/pending-release.json")
          else
            POLICY=$(node --import tsx src/cli.ts classify-bump \
              --old-version "${{ steps.previous.outputs.previous_version }}" \
              --new-version "${{ steps.check.outputs.version }}")
          fi
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Run japicmp compatibility check (when a previous version exists)
        if: steps.previous.outputs.previous_version != ''
        run: ./gradlew japicmpCheck -PjapicmpBaselineJar="${{ steps.baseline.outputs.jar }}"

      - name: Enforce japicmp policy (when a previous version exists)
        if: steps.previous.outputs.previous_version != ''
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          HAS_MIGRATION_DOC=""
          if [[ -f "$GITHUB_WORKSPACE/docs/migrations/${{ steps.check.outputs.version }}.md" ]]; then
            HAS_MIGRATION_DOC="--has-migration-doc"
          fi
          node --import tsx src/cli.ts check-japicmp-report \
            --report "$GITHUB_WORKSPACE/build/reports/japicmp/qilletni-docgen.xml" \
            --policy "${{ steps.policy.outputs.policy }}" $HAS_MIGRATION_DOC

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxDirectBom

      - name: Publish
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Compute published artifact hash
        id: hashes
        run: |
          echo "sha256=$(sha256sum build/libs/qilletni-docgen-${{ steps.check.outputs.version }}.jar | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Poll Maven Central for propagation
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          node --import tsx src/cli.ts poll-maven-central \
            --group dev.qilletni.docgen --artifact qilletni-docgen --version "${{ steps.check.outputs.version }}"

      - name: Extract release notes
        uses: ffurrer2/extract-release-notes@v2
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: RELEASE_NOTES.md
          prerelease: false

      - name: Create GitHub Release with SBOM
        run: |
          gh release create "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md \
            "build/reports/cyclonedx-direct/bom.json#qilletni-docgen-bom.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notifies every repository registered as a consumer of qilletni-docgen in
  # Qilletni/Qilletni's release/components.yml (currently QilletniToolchain
  # only) only after the artifact above has been verified live on Maven
  # Central.
  dispatch:
    needs: build-and-publish
    uses: Qilletni/Qilletni/.github/workflows/reusable-dependency-dispatch.yml@master
    with:
      component: qilletni-docgen
      version: ${{ needs.build-and-publish.outputs.version }}
      commit: ${{ needs.build-and-publish.outputs.commit }}
      repository: Qilletni/QilletniDocgen
      artifacts: |
        dev.qilletni.docgen:qilletni-docgen:${{ needs.build-and-publish.outputs.version }}=${{ needs.build-and-publish.outputs.sha256 }}
    secrets:
      app-id: ${{ secrets.QILLETNI_RELEASE_APP_ID }}
      app-private-key: ${{ secrets.QILLETNI_RELEASE_APP_PRIVATE_KEY }}

  snapshot-followup:
    needs: [build-and-publish, dispatch]
    uses: Qilletni/Qilletni/.github/workflows/reusable-snapshot-followup.yml@master
    with:
      version_file: gradle.properties
      version_key: qilletniDocgenVersion
      released_version: ${{ needs.build-and-publish.outputs.version }}
    secrets:
      app-id: ${{ secrets.QILLETNI_RELEASE_APP_ID }}
      app-private-key: ${{ secrets.QILLETNI_RELEASE_APP_PRIVATE_KEY }}
