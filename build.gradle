buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.bit3:jsass:5.10.4'  // Use the latest version available
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish' version '0.35.0'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
    id 'org.cyclonedx.bom' version '3.2.4'
}

group = 'dev.qilletni.docgen'
version = qilletniDocgenVersion

// Locks the resolved dependency graph for the configurations used to build
// and publish the release artifact, so a published version is always built
// from an exact, checked-in set of resolved coordinates (gradle.lockfile).
// Regenerate with `./gradlew dependencies --write-locks` after a dependency
// change.
dependencyLocking {
    lockAllConfigurations()
}

// `mavenLocal()` is excluded from default release/CI dependency resolution.
// Enable with `-PuseMavenLocal=true`.
def useMavenLocal = providers.gradleProperty('useMavenLocal').getOrElse('false').toBoolean()

repositories {
    if (useMavenLocal) {
        mavenLocal()
    }

    mavenCentral()

    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation ('org.thymeleaf:thymeleaf:3.1.2.RELEASE') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    compileOnly "dev.qilletni.impl:qilletni:${qilletniCoreVersion}"
    compileOnly "dev.qilletni.api:qilletni-api:${qilletniCoreVersion}"

    // For markdown parsing
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'

    // For caching scanned libraries
    implementation 'org.msgpack:msgpack-core:0.9.10'
    
    // For generating an index
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // SLF4J API dependency
    implementation 'org.apache.logging.log4j:log4j-api:2.25.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.1'
}

test {
    useJUnitPlatform()

    // Disabling tests for now
    // `compileTestJava` is disabled too, since disabling `test` alone still builds them.
    enabled = false
}

tasks.named('compileTestJava') {
    enabled = false
}

mavenPublishing {
    coordinates(group, rootProject.name, version)

    pom {
        name = "Qilletni Docgen"
        description = "Documentation generator for Qilletni"
        inceptionYear = "2024"
        url = "https://docs.qilletni.dev/"
        licenses {
            license {
                name = "MIT"
                url = "https://mit-license.org/"
                distribution = "https://mit-license.org/"
            }
        }
        developers {
            developer {
                id = "RubbaBoy"
                name = "Adam Yarris"
                url = "https://github.com/RubbaBoy/"
            }
        }
        scm {
            url = "https://github.com/Qilletni/QilletniDocgen"
            connection = "scm:git:git://github.com/Qilletni/QilletniDocgen.git"
            developerConnection = "scm:git:ssh://git@github.com/Qilletni/QilletniDocgen.git"
        }
    }
}

// CycloneDX JSON SBOM, attached as a release asset by the publish workflow.
// Output: build/reports/cyclonedx-direct/bom.json
cyclonedxDirectBom {
    includeConfigs = ['runtimeClasspath']
}

// Public API compatibility check for `dev.qilletni.docgen:qilletni-docgen`, enforced
// against the policy in `tools/release/release/japicmp_policy.py` (see
// `.qilletni/release.yml`, in `Qilletni/Qilletni`). `-PjapicmpBaselineJar=/path/to/old.jar`
// points at the previously published baseline jar (downloaded and hash-verified
// beforehand, see `RELEASE.md`); the task is skipped if it is not supplied (e.g. for
// the first release).
import me.champeau.gradle.japicmp.JapicmpTask

def japicmpBaselineJar = findProperty('japicmpBaselineJar')

tasks.register('japicmpCheck', JapicmpTask) {
    description = 'Compares the current public API against the published baseline jar'
    onlyIf { japicmpBaselineJar != null }
    if (japicmpBaselineJar != null) {
        oldClasspath.from(files(japicmpBaselineJar))
    }
    newClasspath.from(tasks.named('jar').map { it.outputs.files })
    dependsOn tasks.named('jar')
    accessModifier = 'public'
    onlyBinaryIncompatibleModified = false
    failOnModification = false
    ignoreMissingClasses = true
    xmlOutputFile = file("${buildDir}/reports/japicmp/qilletni-docgen.xml")
}

// Guards a stable release publication from ever resolving a SNAPSHOT or
// dynamic-version dependency, run by release.yml before publishing a tag.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

tasks.register('checkNoSnapshotDependencies') {
    description = 'Fails if the resolved runtime/compile classpath contains a SNAPSHOT or dynamic external dependency version'
    doLast {
        def offenders = []
        ['runtimeClasspath', 'compileClasspath'].each { configName ->
            configurations.getByName(configName).incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof ModuleComponentIdentifier) {
                    def version = id.version
                    if (version.contains('SNAPSHOT') || version.contains('+') || version.startsWith('latest.')) {
                        offenders << "${configName}: ${id.group}:${id.module}:${version}".toString()
                    }
                }
            }
        }
        if (offenders) {
            throw new GradleException("A stable release must not resolve SNAPSHOT/dynamic dependencies:\n" + offenders.join('\n'))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        options.compilerArgs = ['--module-path', classpath.asPath]
        classpath = files()
    }
}

tasks.withType(Javadoc).configureEach {
    doFirst {
        options.modulePath = classpath.files as List
        classpath = files()
    }
}

tasks.register('generateHtml', JavaExec) {
    mainClass = 'dev.qilletni.docgen.Main'
    classpath = sourceSets.main.runtimeClasspath
}

import io.bit3.jsass.Compiler
import io.bit3.jsass.Options

task compileScss {
    jar.dependsOn compileScss

    doLast {
        File inputFile = file('src/main/resources/static/style.scss')
        File outputFile = file('build/resources/main/static/style.css')
        outputFile.parentFile.mkdirs()

        Compiler compiler = new Compiler()
        Options options = new Options()

        def result = compiler.compileString(inputFile.text, options)
        outputFile.text = result.getCss()
    }
}
